<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>运营后台 · 砚稿</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/account.css"><script defer src="/common.js"></script><script defer src="/admin.js"></script></head><body><nav class="account-nav"><div class="brand"><b class="seal">砚</b><strong>砚稿</strong></div><a href="/">写作工作台</a><a href="/wallet.html">我的点数</a><button id="logout" class="text-btn">退出</button></nav><main class="business"><div class="account-head"><small>YANFOLIO ADMINISTRATION</small><h1>运营后台</h1></div><div id="metrics" class="summary-strip"></div><nav class="manager-tabs"><button data-tab="models" class="selected">模型与接口</button><button data-tab="vouchers">套餐与发码</button><button data-tab="users">账号</button><button data-tab="audit">操作记录</button></nav><p id="feedback" role="status" class="feedback"></p>
<div id="tab-models"><section class="panel"><h2>模型目录</h2><div id="models" class="table-wrap"></div><button id="new-model" class="text-btn">添加模型</button></section><section class="panel"><h2 id="model-title">添加模型</h2><form id="model-form"><div class="config-grid"><label>展示名称<input name="label" required maxlength="80"></label><label>上游模型 ID<input name="model" required maxlength="160"></label><label class="wide">兼容接口地址<input name="base" type="url" placeholder="https://api.example.com/v1" required></label><label class="wide">API 密钥<input name="secret" type="password" autocomplete="new-password" placeholder="编辑时留空保留现有密钥"></label><label>保存时的密钥处理<select name="key_action"><option value="keep">保留现有或使用新填写的密钥</option><option value="clear">清除已保存密钥</option></select></label><label>每次模型调用基础点数<input name="fee" type="number" min="1" max="100000" value="2" required></label><label>单次输出 Token 上限<input name="max_output" type="number" min="64" max="8192" value="768" required></label><label>每千输入 Token 点数<input name="input_rate" type="number" min="0" max="10000" value="0" required></label><label>每千输出 Token 点数<input name="output_rate" type="number" min="0" max="10000" value="0" required></label><label>状态<select name="enabled"><option value="1">启用</option><option value="0">下架</option></select></label></div><button class="primary">保存模型</button></form></section></div>
<div id="tab-vouchers" hidden><section class="panel"><h2>充值套餐</h2><div id="packs" class="table-wrap"></div><button class="text-btn" id="new-pack">添加套餐</button><form id="pack-form"><div class="config-grid"><label>套餐名<input required name="label" maxlength="60"></label><label>点数<input type="number" required name="points" min="1"></label><label>参考售价（元）<input type="number" required name="yuan" step="0.01" min="0"></label><label>状态<select name="enabled"><option value="1">在售</option><option value="0">下架</option></select></label></div><button class="button">保存套餐</button></form></section><section class="panel"><h2>发行兑换码</h2><form id="issue-form"><div class="config-grid"><label>套餐<select id="issue-pack" required></select></label><label>数量<input id="issue-count" type="number" value="1" required min="1" max="100"></label></div><button class="primary">生成兑换码</button></form><div hidden id="issued"><label for="code-output">本批完整兑换码仅显示一次，请保存后交付购买者</label><textarea id="code-output" rows="5" readonly></textarea><button class="button" id="download-codes">下载本批兑换码</button></div></section><section class="panel"><h2>发行批次</h2><div id="batches" class="table-wrap"></div></section></div>
<div id="tab-users" hidden><section class="panel"><h2>用户账号</h2><form class="inline" id="user-search"><input id="user-q" placeholder="按邮箱查询" aria-label="邮箱"><button class="button">查询</button></form><div id="users" class="table-wrap"></div></section></div><div id="tab-audit" hidden><section class="panel"><h2>管理员操作记录</h2><div id="audit" class="table-wrap"></div></section></div></main></body></html>
