<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><script src="/appearance.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPT 制作 · 砚稿</title><link rel="icon" href="/yanfolio.ico"><link rel="stylesheet" href="/ui.css"><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="/slides.css"><link rel="stylesheet" href="/appearance.css"><script defer src="/ui.js"></script><script defer src="/common.js"></script><script defer src="/transfer.js"></script><script defer src="/slides.js"></script></head>
<body><nav class="account-nav" aria-label="工作区导航"><a class="brand" href="/"><span class="seal"></span><strong>Yanfolio</strong></a><a href="/studio"><i data-icon="pen"></i>写作工作台</a><a href="/slides"><i data-icon="desktop"></i>PPT 制作</a><a href="/drive.html"><i data-icon="folder"></i>云文档</a><a href="/profile.html"><i data-icon="user"></i>个人中心</a><a href="/wallet.html"><i data-icon="wallet"></i>点数钱包</a><button id="logout" class="text-btn"><i data-icon="logout"></i>退出</button></nav>
<main class="business deck-app"><p id="feedback" role="status" class="deck-feedback" hidden></p>
<section id="gallery"><header class="account-head"><div><h1>PPT 制作</h1><p class="sub">从论文手稿、题目或已有演示开始，逐页编辑后导出 PowerPoint。</p></div><div class="actions"><button class="button" id="import-ppt">导入 PPTX 文字</button><button class="primary" id="new-deck"><i data-icon="plus"></i>新建演示</button></div></header>
<section><div class="deck-section-head"><h2>选择模板</h2></div><div class="template-grid" id="templates"></div></section>
<section class="drafts-section"><div class="deck-section-head"><h2>我的演示稿</h2><span id="draft-count"></span></div><div class="deck-list" id="decks"></div></section></section>
<section id="editor" hidden><header class="deck-header"><div><button class="text-btn" id="back">返回演示库</button><label class="sr" for="deck-title">演示稿名称</label><input id="deck-title" maxlength="120" placeholder="演示稿名称"></div><div class="actions"><small id="sync" role="status"></small><button class="button" id="deck-cloud"><i data-icon="cloud"></i>存入云文档</button><button class="primary" id="deck-export"><i data-icon="download"></i>导出 PPTX</button></div></header>
<div id="deck-conflict" class="deck-conflict" hidden><span>云端版本已变化，本机编辑已暂存。</span><button id="copy-deck" class="button">另存副本</button><button id="reload-deck" class="text-btn">载入云端版</button></div>
<div class="deck-grid"><aside class="slide-rail"><div class="deck-section-head"><h2>页序</h2><button class="button compact" id="add-slide" title="在当前页后增加一页" aria-label="增加一页">＋</button></div><div id="page-list"></div></aside>
<div class="slide-stage"><div class="deck-section-head"><label for="theme">演示模板</label><select id="theme"></select></div><div class="canvas-wrap"><img id="slide-preview" alt="幻灯片预览"></div><div class="deck-section-head stage-foot"><span id="page-number"></span><div class="actions"><button class="button compact" id="prev-page">上一页</button><button class="button compact" id="next-page">下一页</button><button class="button compact" id="present">放映</button></div></div><p id="preview-warning" class="feedback"></p></div>
<aside class="slide-fields"><div class="deck-section-head"><h2>编辑本页</h2><select id="layout" aria-label="本页版式"><option value="cover">封面</option><option value="content">正文</option><option value="columns">双栏</option><option value="closing">收尾</option></select></div><div id="fields"></div>
<details><summary>讲者备注与页眉</summary><label>页眉<input id="slide-eyebrow" maxlength="60"></label><label>讲者备注<textarea id="slide-notes" maxlength="2000" rows="3"></textarea></label></details>
<div class="page-tools"><button id="up" class="text-btn">前移</button><button id="down" class="text-btn">后移</button><button id="duplicate" class="text-btn">复制页</button><button id="remove" class="text-btn">移除页</button></div></aside></div></section>
<dialog id="create-dialog"><form id="create-form"><header class="deck-section-head"><h2>制作演示稿</h2><button class="text-btn" type="button" id="cancel-create">关闭</button></header>
<label>从手稿带入材料<select id="source-doc"><option value="">输入题目或自行粘贴材料</option></select></label>
<label>演示题目<input id="new-title" maxlength="120" required placeholder="例如，城市绿地研究开题汇报"></label>
<label>演示材料<textarea id="material" maxlength="20000" rows="4" placeholder="粘贴已有段落。留空时可以从封面开始制作。"></textarea></label>
<label>使用模板<select id="new-template"></select></label><div class="two-fields"><label>AI 模型<select id="slide-model"></select></label><label>AI 生成页数<select id="page-count"><option>3</option><option>4</option><option selected>5</option><option>6</option><option>7</option><option>8</option></select></label></div>
<div id="quote" hidden class="deck-conflict"><p id="quote-text"></p><button type="button" class="primary" id="confirm-ai">确认生成</button></div>
<p class="feedback" id="create-status" role="status"></p><div class="actions"><button type="button" class="button" id="make-free">直接建稿 · 免点数</button><button class="primary" id="quote-ai">AI 起草 · 查看报价</button></div></form></dialog>
<dialog id="import-dialog"><form id="import-form"><header class="deck-section-head"><h2>导入 PPTX</h2><button type="button" class="text-btn" id="cancel-import">关闭</button></header><p class="sub">提取页内文本框与讲者备注，并以可编辑模板重新排版。原文件中的图片、图表和动画仍保留在原件中。</p><label>源文件<input id="ppt-file" type="file" accept=".pptx" required></label><label>外部演示使用的模板<select id="import-theme"></select></label><p role="status" class="feedback" id="import-status"></p><button class="primary">导入为新草稿</button></form></dialog>
<dialog id="show-dialog" aria-label="演示放映"><img id="show-image" alt="当前放映页"><div class="actions"><button id="show-prev" class="button">上一页</button><span id="show-count"></span><button id="show-next" class="button">下一页</button><button id="end-show" class="button">结束放映</button></div></dialog>
</main></body></html>
