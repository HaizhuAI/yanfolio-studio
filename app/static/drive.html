<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云文档 · 砚稿 Yanfolio</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="/cloud.css"><script defer src="/common.js"></script><script defer src="/transfer.js"></script><script defer src="/drive.js"></script></head><body><nav class="account-nav"><a class="brand" href="/"><b class="seal">砚</b><strong>砚稿</strong></a><a href="/studio">写作工作台</a><a href="/drive.html">云文档</a><a href="/profile.html">个人中心</a><a href="/wallet.html">点数钱包</a><button id="logout" class="text-btn">退出</button></nav><main class="business"><div class="account-head drive-heading"><div><small>DOCUMENT LIBRARY</small><h1>我的云文档</h1></div><button class="primary" id="upload">上传文档</button></div><input type="file" id="file-input" hidden><div class="drive-grid"><aside class="drive-side panel"><h2>文档库</h2><button class="folder current" id="root">根目录</button><div id="folders"></div><button class="text-btn" id="new-folder">新建文件夹</button><div id="folder-actions" hidden><button class="text-btn" id="rename-folder">更名</button> <button class="text-btn" id="remove-folder">删除空文件夹</button></div><button class="folder trash" id="trash">回收站</button><div class="space-meter"><strong id="quota-label"></strong><progress id="meter" max="100" value="0"></progress><small id="usage-detail"></small></div></aside><div class="library-main"><section class="panel"><div class="listing-head"><h2 id="location">根目录</h2><form class="inline" id="search"><input id="query" placeholder="搜索文件名" aria-label="搜索文件名" maxlength="160"><button class="button">搜索</button></form></div><div class="table-wrap"><table><thead><tr><th>文件名</th><th>大小</th><th>修改时间</th><th>操作</th></tr></thead><tbody id="items"></tbody></table></div><div class="pager"><button class="text-btn" id="prev">上一页</button><small id="page-info"></small><button class="text-btn" id="next">下一页</button></div></section><section class="panel" id="transfers" hidden><h2>上传任务</h2><p class="sub">中断后重新选择原文件即可继续，未完成的任务保留 24 小时。</p><div id="pending"></div></section><section class="panel" id="versions-panel" hidden><div class="listing-head"><h2 id="versions-title">历史版本</h2><button class="text-btn" id="close-versions">关闭</button></div><div id="versions"></div></section></div></div><div id="transfer-progress" hidden><span id="transfer-text"></span><progress id="transfer-meter" max="100" value="0"></progress><button class="button" id="pause">暂停上传</button></div><p id="feedback" class="feedback" role="status"></p><dialog id="move-dialog"><form method="dialog"><label for="destination">移至文件夹</label><select id="destination"></select><div class="inline"><button value="cancel" class="button">取消</button><button value="ok" class="primary">移动</button></div></form></dialog></main></body></html>
