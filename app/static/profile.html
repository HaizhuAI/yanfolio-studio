<!doctype html><html lang="zh-CN"><head><script src="/appearance.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人中心 · 砚稿 Yanfolio</title><link rel="icon" href="/yanfolio.ico"><link rel="stylesheet" href="/ui.css"><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="/cloud.css"><script defer src="/ui.js"></script><script defer src="/common.js"></script><script defer src="/transfer.js"></script><script defer src="/profile.js"></script><link rel="stylesheet" href="/appearance.css"></head>
<body><nav class="account-nav" aria-label="账号导航"><a class="brand" href="/" aria-label="砚稿首页"><span class="seal" aria-hidden="true"></span><strong>Yanfolio</strong></a><a href="/studio"><i data-icon="pen"></i>写作工作台</a><a href="/slides"><i data-icon="desktop"></i>PPT 制作</a><a href="/drive.html"><i data-icon="folder"></i>云文档</a><a href="/profile.html"><i data-icon="user"></i>个人中心</a><a href="/wallet.html"><i data-icon="wallet"></i>点数钱包</a><a id="admin-portal" href="/admin.html" hidden><i data-icon="sliders"></i>运营后台</a><button id="logout" class="text-btn"><i data-icon="logout"></i>退出</button></nav>
<main class="business"><header class="account-head"><h1>个人中心</h1><a href="/studio" class="primary"><i data-icon="pen"></i>打开写作工作台</a></header>
<div class="identity-banner"><div class="identity"><span id="avatar" aria-hidden="true">砚</span><div><h2 id="person">我的账号</h2><p id="email"></p></div></div><p id="joined"></p></div>
<div class="dashboard-stats"><section class="panel storage-metric"><div class="card-head"><span class="stat-icon"><i data-icon="cloud"></i></span><h2>我的文档空间</h2><a class="text-btn" href="/drive.html">管理云文档</a></div><p class="quota-title"><strong id="used">—</strong><span> / </span><span id="quota">5 GB</span></p><progress id="meter" max="100" value="0" aria-label="文档空间使用比例"></progress><p class="sub" id="counts"></p></section>
<section class="panel wallet-metric"><div class="card-head"><span class="stat-icon"><i data-icon="wallet"></i></span><h2>写作点数</h2></div><p class="quota-title"><strong id="balance">—</strong> 点</p><a class="text-btn" href="/wallet.html">兑换点数与查看流水</a></section></div>
<div class="profile-grid"><section class="panel"><h2>个人资料</h2><form id="profile-form"><label>显示名称<input id="name" maxlength="60" autocomplete="nickname"></label><div class="profile-fields"><label>学校或机构<input id="institution" maxlength="120" autocomplete="organization"></label><label>研究方向<input id="discipline" maxlength="80"></label></div><button class="button">保存资料</button><p class="feedback" role="status" id="feedback"></p></form></section>
<div><section class="panel"><h2>最近更新的文档</h2><div id="recent-files"></div></section><section class="panel"><h2>已登录设备</h2><p class="sub">可结束其他设备的登录会话。</p><div id="devices"></div></section></div></div></main></body></html>
