<!doctype html><html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 砚稿 Yanfolio</title><link rel="icon" href="/yanfolio.ico"><link rel="stylesheet" href="/ui.css"><link rel="stylesheet" href="/account.css"><script defer src="/ui.js"></script><script defer src="/common.js"></script><script defer src="/login.js"></script></head>
<body class="auth-page"><main class="auth-layout">
<section class="auth-cover"><a href="/" class="brand"><span class="seal" aria-hidden="true"></span><strong>Yanfolio</strong><em>砚稿</em></a><div class="auth-art"><img src="/yanfolio-optic.webp" alt=""></div><div class="auth-caption"><h1>学术写作工作台</h1><p>在网页与 Windows 之间，继续同一份手稿。</p></div></section>
<section class="auth-card"><a class="back-home" href="/"><i data-icon="back"></i>返回官网</a><header><h1 id="auth-title">登录砚稿</h1></header><form id="auth-form"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" maxlength="254" required placeholder="name@example.com"><label for="password" id="pass-label">密码</label><div class="password-field"><input id="password" type="password" autocomplete="current-password" maxlength="256" required><button id="reveal-password" type="button" aria-label="显示密码" aria-pressed="false"><i data-icon="eye"></i></button></div><div id="code-row" hidden><label for="code">邮箱验证码</label><div class="inline"><input id="code" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" autocomplete="one-time-code"><button id="send-code" type="button" class="button">获取验证码</button></div></div><p id="response" class="feedback" role="status"></p><button class="primary" id="submit">登录</button></form><footer><button class="text-btn" data-mode="register">注册账号</button><button class="text-btn" data-mode="reset">忘记密码</button><button class="text-btn" data-mode="login" hidden>返回登录</button></footer><a id="desktop-download" class="back-home" href="/desktop/download" download hidden><i data-icon="desktop"></i>下载 Windows 桌面端</a></section>
</main></body></html>
