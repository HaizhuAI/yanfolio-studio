<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 砚稿 Yanfolio</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/account.css"><script defer src="/common.js"></script><script defer src="/login.js"></script></head>
<body class="auth-page"><main class="auth-layout"><section class="auth-cover"><a href="/" class="brand brand-home"><b class="seal">砚</b><div><strong>砚稿</strong><span>YANFOLIO</span></div></a><div class="paper-art" aria-hidden="true"><i></i><i></i><i></i></div><div><h1>学术写作工作台</h1><p>从研究问题、文献证据，到可审阅的 Word 手稿。</p></div></section>
<section class="auth-card"><header><small>YANFOLIO ACCOUNT</small><h1 id="auth-title">登录砚稿</h1></header><form id="auth-form"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" maxlength="254" required placeholder="name@example.com"><label for="password" id="pass-label">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required><div id="code-row" hidden><label for="code">邮箱验证码</label><div class="inline"><input id="code" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" autocomplete="one-time-code"><button id="send-code" type="button" class="button">获取验证码</button></div></div><p id="response" class="feedback" role="status"></p><button class="primary" id="submit">登录</button></form><footer><button class="text-btn" data-mode="register">注册账号</button><button class="text-btn" data-mode="reset">忘记密码</button><button class="text-btn" data-mode="login" hidden>返回登录</button></footer><a id="desktop-download" class="text-btn" href="/desktop/download" download hidden>下载 Windows 桌面端</a></section></main></body></html>
